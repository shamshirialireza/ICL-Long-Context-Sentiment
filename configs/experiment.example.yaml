# Benchmark configuration.

# Copy this file, point `datasets` at your own CSV/JSON/Parquet files, and
# choose which model providers to compare. Any number of datasets, providers,
# and shot counts can be listed, the runner sweeps the full cartesian product.

# Set API key as an environment variable for each model before running:
#   export OPENAI_API_KEY=...
#   export ANTHROPIC_API_KEY=...
#   export GOOGLE_API_KEY=...

labels: [positive, neutral, negative]
shot_counts: [0, 3, 6, 9]
document_noun: review          # word used in the prompt, e.g. "comment", "post", "review"
output_dir: results
example_seed: 42
length_unit: chars

datasets:
  - name: news
    path: data/sample/News.csv
    text_column: text
    label_column: label

  - name: facebook
    path: data/sample/facebook.csv
    text_column: text
    label_column: label

providers:
  - name: openai
    model: gpt-4o
    api_key_env: OPENAI_API_KEY
    temperature: 0
    max_tokens: 10
    request_interval: 0.0
    max_retries: 3

  - name: anthropic
    model: claude-sonnet-5
    api_key_env: ANTHROPIC_API_KEY
    # temperature is not supported by current Claude models and is ignored.
    # Thinking tokens count toward max_tokens on claude-sonnet-5, so leave headroom.
    max_tokens: 200
    request_interval: 0.0
    max_retries: 3

  - name: gemini
    model: gemini-3.6-flash
    api_key_env: GOOGLE_API_KEY
    temperature: 0
    # Gemini 2.5 thinking tokens count toward max_output_tokens, so leave headroom.
    max_tokens: 500
    request_interval: 0.0
    max_retries: 3
